# Workflow para implantar o site automaticamente no GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

# Define as permissões do GITHUB_TOKEN para permitir a publicação no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas uma implantação seja executada por vez para evitar conflitos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            npm install
          else
            npm install
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Envia a pasta raiz onde estão os arquivos index.html, gerador.html, styles.css, etc.

      - name: Implantação no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
